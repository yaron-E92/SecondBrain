name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build, and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore cached .NET workloads
        id: restore-dotnet-workloads
        uses: actions/cache/restore@v4
        with:
          path: |
            'C:\Program Files\dotnet\packs'
            'C:\Program Files\dotnet\sdk-manifests'
            C:\ProgramData\dotnet\workload*
            'C:\Program Files\dotnet\metadata'
          key: ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-${{ hashFiles('**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-
            ${{ runner.os }}-dotnet-

      - name: Restore cached Android SDK
        id: restore-android-sdk
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ${{ env.ANDROID_SDK_ROOT }}
            C:\Users\runneradmin\.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install MAUI workload
        if: steps.restore-dotnet-workloads.outputs.cache-hit != 'true'
        run: dotnet workload install maui --skip-manifest-update

      - name: Install Android SDK components
        if: steps.restore-android-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "tools"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to install Android SDK components"
            exit 1
          }

      - name: Save .NET workloads cache
        if: steps.restore-dotnet-workloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            'C:\Program Files\dotnet\packs'
            'C:\Program Files\dotnet\sdk-manifests'
            C:\ProgramData\dotnet\workload*
            'C:\Program Files\dotnet\metadata'
          key: ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-${{ hashFiles('**/global.json') }}

      - name: Save Android SDK cache
        if: steps.restore-android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ${{ env.ANDROID_SDK_ROOT }}
            C:\Users\runneradmin\.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/global.json') }}

      - name: Restore dependencies
        run: dotnet restore SecondBrain.slnx

      - name: Build
        run: dotnet build SecondBrain.slnx --configuration Debug --no-restore

      - name: Test
        run: dotnet test SecondBrain.slnx --configuration Debug --no-build --no-restore

  linux-android-build-and-smoke-test:
    name: Linux Android build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Restore MAUI Android workload
        run: dotnet workload restore SecondBrain.App/SecondBrain.App.csproj --skip-manifest-update

      - name: Install Android dependencies
        run: >-
          dotnet build SecondBrain.App/SecondBrain.App.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AcceptAndroidSdkLicenses=true

      - name: Restore dependencies
        run: dotnet restore SecondBrain.slnx

      - name: Build
        run: dotnet build SecondBrain.slnx --configuration Debug --no-restore

      - name: Test
        run: dotnet test SecondBrain.slnx --configuration Debug --no-build --no-restore

      - name: Create Android emulator
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name secondbrain-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel

      - name: Start Android emulator
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          sudo chmod 666 /dev/kvm
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd secondbrain-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/android-emulator.log" 2>&1 &
          timeout 180 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in {1..120}; do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              exit 0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/android-emulator.log"
          exit 1

      - name: Run Android smoke test
        shell: bash
        run: |
          dotnet build SecondBrain.App/SecondBrain.App.csproj \
            --configuration Debug \
            --no-restore \
            -f net10.0-android \
            -t:Run
          for attempt in {1..30}; do
            if [ -n "$("$ANDROID_HOME/platform-tools/adb" shell pidof com.secondbrain.app | tr -d '\r')" ]; then
              exit 0
            fi
            sleep 2
          done
          "$ANDROID_HOME/platform-tools/adb" logcat -d
          exit 1

      - name: Show emulator log on failure
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/android-emulator.log" || true
