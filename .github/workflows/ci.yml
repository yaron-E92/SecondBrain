name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build, and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore cached .NET workloads
        id: restore-dotnet-workloads
        uses: actions/cache/restore@v4
        with:
          path: |
            'C:\Program Files\dotnet\packs'
            'C:\Program Files\dotnet\sdk-manifests'
            C:\ProgramData\dotnet\workload*
            'C:\Program Files\dotnet\metadata'
          key: ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-${{ hashFiles('**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-
            ${{ runner.os }}-dotnet-

      - name: Restore cached Android SDK
        id: restore-android-sdk
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ${{ env.ANDROID_SDK_ROOT }}
            C:\Users\runneradmin\.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install MAUI workload
        if: steps.restore-dotnet-workloads.outputs.cache-hit != 'true'
        run: dotnet workload install maui --skip-manifest-update

      - name: Install Android SDK components
        if: steps.restore-android-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "tools"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to install Android SDK components"
            exit 1
          }

      - name: Save .NET workloads cache
        if: steps.restore-dotnet-workloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            'C:\Program Files\dotnet\packs'
            'C:\Program Files\dotnet\sdk-manifests'
            C:\ProgramData\dotnet\workload*
            'C:\Program Files\dotnet\metadata'
          key: ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-${{ hashFiles('**/global.json') }}

      - name: Save Android SDK cache
        if: steps.restore-android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ${{ env.ANDROID_SDK_ROOT }}
            C:\Users\runneradmin\.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/global.json') }}

      - name: Restore dependencies
        run: dotnet restore SecondBrain.slnx

      - name: Build
        run: dotnet build SecondBrain.slnx --configuration Debug --no-restore

      - name: Test
        run: dotnet test SecondBrain.slnx --configuration Debug --no-build --no-restore

  linux-android-build-and-smoke-test:
    name: Linux Android build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        id: setup-dotnet-linux
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache .NET workloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dotnet-workload-cache
          key: ${{ runner.os }}-dotnet-workloads-${{ steps.setup-dotnet-linux.outputs.dotnet-version }}-v2-${{ hashFiles('global.json', 'SecondBrain.Presentation/SecondBrain.Presentation.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-workloads-${{ steps.setup-dotnet-linux.outputs.dotnet-version }}-v2-

      - name: Restore .NET workload files
        shell: bash
        run: |
          workload_cache="$RUNNER_TEMP/dotnet-workload-cache"
          if [ -d "$workload_cache/packs" ]; then
            sudo cp -a "$workload_cache/packs/." /usr/share/dotnet/packs/
          fi
          if [ -d "$workload_cache/sdk-manifests" ]; then
            sudo cp -a "$workload_cache/sdk-manifests/." /usr/share/dotnet/sdk-manifests/
          fi
          if [ -d "$workload_cache/metadata" ]; then
            sudo cp -a "$workload_cache/metadata/." /usr/share/dotnet/metadata/
          fi

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ steps.setup-dotnet-linux.outputs.dotnet-version }}-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ steps.setup-dotnet-linux.outputs.dotnet-version }}-

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Cache Android SDK and emulator
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk-cache
          key: ${{ runner.os }}-android-sdk-${{ steps.setup-dotnet-linux.outputs.dotnet-version }}-api35-v2-${{ hashFiles('global.json', 'SecondBrain.Presentation/SecondBrain.Presentation.csproj') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-${{ steps.setup-dotnet-linux.outputs.dotnet-version }}-api35-v2-

      - name: Restore Android SDK files
        shell: bash
        run: |
          android_cache="$RUNNER_TEMP/android-sdk-cache"
          if [ -d "$android_cache" ]; then
            sudo cp -a "$android_cache/." "$ANDROID_HOME/"
          fi

      - name: Validate Linux Android scripts
        shell: bash
        run: bash -n scripts/test-linux-android.sh scripts/run-linux-android.sh

      - name: Build and run SecondBrain on Android
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
          SECOND_BRAIN_AVD_NAME: secondbrain-ci
          SECOND_BRAIN_EMULATOR_LOG: ${{ runner.temp }}/android-emulator.log
        run: scripts/test-linux-android.sh

      - name: Stage .NET workload cache
        shell: bash
        run: |
          workload_cache="$RUNNER_TEMP/dotnet-workload-cache"
          mkdir -p "$workload_cache/packs" "$workload_cache/sdk-manifests" "$workload_cache/metadata"
          for pack in /usr/share/dotnet/packs/Microsoft.Android.* /usr/share/dotnet/packs/Microsoft.Maui.*; do
            if [ -d "$pack" ]; then
              cp -a "$pack" "$workload_cache/packs/"
            fi
          done
          for feature_band in /usr/share/dotnet/sdk-manifests/*; do
            for manifest in microsoft.net.sdk.android microsoft.net.sdk.maui; do
              if [ -d "$feature_band/$manifest" ]; then
                cached_feature_band="$workload_cache/sdk-manifests/$(basename "$feature_band")"
                mkdir -p "$cached_feature_band"
                cp -a "$feature_band/$manifest" "$cached_feature_band/"
              fi
            done
          done
          if [ -d /usr/share/dotnet/metadata/workloads ]; then
            cp -a /usr/share/dotnet/metadata/workloads "$workload_cache/metadata/"
          fi

      - name: Stage Android SDK cache
        shell: bash
        run: |
          android_cache="$RUNNER_TEMP/android-sdk-cache"
          mkdir -p "$android_cache/system-images/android-35/google_apis"
          cp -a "$ANDROID_HOME/emulator" "$android_cache/"
          cp -a "$ANDROID_HOME/platform-tools" "$android_cache/"
          cp -a "$ANDROID_HOME/system-images/android-35/google_apis/x86_64" \
            "$android_cache/system-images/android-35/google_apis/"

      - name: Restore dependencies
        run: dotnet restore SecondBrain.slnx

      - name: Build
        run: dotnet build SecondBrain.slnx --configuration Debug --no-restore

      - name: Test
        run: dotnet test SecondBrain.slnx --configuration Debug --no-build --no-restore

      - name: Show emulator log on failure
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/android-emulator.log" || true
